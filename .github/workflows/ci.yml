name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      # npm ci cannot use a lockfile written on macOS: other-platform optional packages are recorded
      # without versions (npm/cli#4828). npm install resolves them; versions still come from the lock.
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
